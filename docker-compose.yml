services:
  db:
    image: postgres:16-alpine
    container_name: reparasuite-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - reparasuite_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./reparasuite-api
      dockerfile: Dockerfile
    container_name: reparasuite-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REPARASUITE_DB_URL: ${REPARASUITE_DB_URL}
      REPARASUITE_DB_USERNAME: ${REPARASUITE_DB_USERNAME}
      REPARASUITE_DB_PASSWORD: ${REPARASUITE_DB_PASSWORD}
      REPARASUITE_JWT_SECRET: ${REPARASUITE_JWT_SECRET}
      REPARASUITE_CORS_ALLOWED_ORIGIN_PATTERNS: ${REPARASUITE_CORS_ALLOWED_ORIGIN_PATTERNS}
    ports:
      - "8080:8080" # Necesario para que el navegador externo llegue a la API

  backoffice:
    build:
      context: ./reparasuite-backoffice
      dockerfile: Dockerfile
    container_name: reparasuite-backoffice
    restart: always
    depends_on:
      - api
    ports:
      - "80:80" # App principal (Administración)

  portal:
    build:
      context: . # Para que Docker vea la carpeta /builds/portal que subes por SCP
      dockerfile: ./reparasuite-portal/Dockerfile
    container_name: reparasuite-portal
    restart: always
    depends_on:
      - api
    ports:
      - "4300:80" # Portal de clientes

volumes:
  reparasuite_db_data: